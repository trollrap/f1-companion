# PC version on GitHub Pages: https://<your-user>.github.io/<repo>/
# One-time: repo Settings > Pages > Source = "GitHub Actions". After that every push to main publishes the site.
name: Publish web version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Set the sub-folder the site is served from (the repo name)
        run: node -e "const f='app.json',a=JSON.parse(require('fs').readFileSync(f));a.expo.experiments={...(a.expo.experiments||{}),baseUrl:'/'+process.env.GITHUB_REPOSITORY.split('/')[1]};a.expo.web={bundler:'metro',output:'single',...(a.expo.web||{})};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - run: npx expo export --platform web
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
